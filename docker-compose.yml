# GitLab Webhook 自动镜像构建服务
#
# 安全提示：挂载 /var/run/docker.sock 等同于授予容器宿主机 root 级权限，
# 请仅在受信任的内网构建机上部署，并限制可访问 webhook 端口的来源。
services:
  gitlab-builder:
    image: gitlab-builder:latest
    container_name: gitlab-builder
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 与 GitLab Webhook 的 Secret token 保持一致（必填，用强随机值）
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:?required - set a strong random secret}
      # 可选：全局 SSH Deploy Key 私钥路径（需与下方 secrets 挂载路径一致）
      # 例如 /run/secrets/gitlab_deploy_key；留空则使用容器默认 ssh 身份
      GITLAB_DEPLOY_KEY_PATH: ${GITLAB_DEPLOY_KEY_PATH:-}
      # 可选：镜像仓库密码，供 config.yaml 的 registry.password 以 ${REGISTRY_PASSWORD} 引用
      # 仅在配置了 registry.url（启用推送）时需要
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
      # 可选：debug | info | warn | error
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # 服务配置
      - ./config/config.yaml:/app/config/config.yaml:ro
      # SSH Deploy Key 目录（文件权限建议 chmod 600）
      - ./secrets:/run/secrets:ro
      # 构建工作区与构建日志（持久化）
      - ./data:/app/workspace
      - ./logs:/app/logs
      # 服务目录（deploy.services_dir）：必须与宿主机同路径挂载，
      # 否则 compose 的相对路径（.env / env_file / bind mount）会解析错
      - /data/services:/data/services:ro
      # Docker Socket：服务通过宿主机 Docker 守护进程执行 docker build；
      # 默认仅本地，配置 registry.url 后可 docker login + push
      - /var/run/docker.sock:/var/run/docker.sock