# 多平台代码托管 Webhook 自动镜像构建服务
#
# 业务配置全部在 config/config.yaml；
# 敏感变量（Webhook Secret、token、密码）放在同目录 .env 文件中。
# 首次启动：cp .env.example .env，然后填写 .env。
#
# 安全提示：挂载 /var/run/docker.sock 等同于授予容器宿主机 root 级权限，
# 请仅在受信任的内网构建机上部署，并限制可访问 webhook 端口的来源。
services:
  code-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: code-builder:latest
    container_name: code-builder
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # 服务配置
      - ./config/config.yaml:/app/config/config.yaml:ro
      # SSH Deploy Key 目录（文件权限建议 chmod 600）
      - ./secrets:/run/secrets:ro
      # 构建工作区、构建日志与构建记录（持久化）
      - ./data:/app/workspace
      - ./logs:/app/logs
      # 服务目录（deploy.targets[].dir）；必须与宿主机同路径挂载
      - /data/services:/data/services:ro
      # Docker Socket：执行 docker build / compose
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
