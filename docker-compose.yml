# 多平台代码托管 Webhook 自动镜像构建服务
#
# 安全提示：挂载 /var/run/docker.sock 等同于授予容器宿主机 root 级权限，
# 请仅在受信任的内网构建机上部署，并限制可访问 webhook 端口的来源。
services:
  code-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: code-builder:latest
    container_name: code-builder
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 所有平台共用的 Webhook Secret（必填，用强随机值）
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # 兼容旧变量名：WEBHOOK_SECRET 为空时服务会回退到它
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      # 可选：全局 SSH Deploy Key 私钥路径（需与下方 secrets 挂载路径一致）
      DEPLOY_KEY_PATH: ${DEPLOY_KEY_PATH:-}
      # 可选：旧变量名，仍兼容
      GITLAB_DEPLOY_KEY_PATH: ${GITLAB_DEPLOY_KEY_PATH:-}
      # 可选：平台 HTTPS clone token（私有仓库）
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITEE_TOKEN: ${GITEE_TOKEN:-}
      # 可选：镜像仓库密码，供 config.yaml 的 registry.password 引用
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
      # 可选：飞书机器人地址与签名密钥
      LARK_WEBHOOK_URL: ${LARK_WEBHOOK_URL:-}
      LARK_SECRET: ${LARK_SECRET:-}
      # 可选：debug | info | warn | error
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 服务配置
      - ./config/config.yaml:/app/config/config.yaml:ro
      # SSH Deploy Key 目录（文件权限建议 chmod 600）
      - ./secrets:/run/secrets:ro
      # 构建工作区、构建日志与构建记录（持久化）
      - ./data:/app/workspace
      - ./logs:/app/logs
      # 服务目录（deploy.root / deploy.targets[].dir）：必须与宿主机同路径挂载
      - /data/services:/data/services:ro
      # Docker Socket：服务通过宿主机 Docker 守护进程执行 docker build / compose
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
