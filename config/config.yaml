# 多平台代码构建服务 — 配置示例
#
# 支持 GitLab / GitHub / Gitee。仓库无需登记：只要事件中的仓库地址属于
# 对应平台配置的域名，且分支命中白名单，就会自动构建。
#
# 所有平台共用同一个 Webhook Secret（GitLab 的 Secret token、GitHub 的
# Webhook secret、Gitee 的 Webhook 密码填同一个值）。
#
# ${VAR} 在启动时从环境变量展开；${VAR:-} 表示变量可缺省为空。

server:
  # HTTP 监听地址
  listen: ":8080"
  # git clone 工作区（容器内路径，按仓库+构建任务隔离子目录）
  workspace: "/app/workspace"
  # 构建日志与构建记录存放目录
  logs_dir: "/app/logs"
  # 构建记录持久化文件；省略时默认为 <logs_dir>/builds.json
  state_file: "/app/logs/builds.json"
  # 待处理任务队列上限，超过后 webhook 返回 503
  queue_size: 10
  # 全局并行构建数；同一仓库的任务始终串行执行
  concurrency: 2

code:
  # 全局 Webhook Secret（必填）。三个平台填同一个值。
  webhook_secret: "${WEBHOOK_SECRET:-}"
  # 触发分支白名单：精确名称或 glob（release/*）
  branches:
    - "main"
    - "master"
    - "release/*"

  # 平台配置。省略整个 providers 段时，旧配置 code.domain + code.webhook_secret
  # 等价于只启用 GitLab。
  providers:
    gitlab:
      enabled: true
      # 允许接入的 GitLab 域名（GitLab.com 或自建实例域名）
      domains: ["code.gitlab.com"]
      # 可选：HTTPS 私有仓库 clone token（配置后优先使用 HTTPS；留空则用 Deploy Key/SSH）
      token: "${GITLAB_TOKEN:-}"

    github:
      enabled: true
      # GitHub.com 用 github.com；GitHub Enterprise 填企业域名
      domains: ["github.com"]
      token: "${GITHUB_TOKEN:-}"

    gitee:
      enabled: true
      domains: ["gitee.com"]
      token: "${GITEE_TOKEN:-}"

# 各步骤超时（可选）；省略时使用下面默认值
timeouts:
  clone: "15m"
  build: "25m"
  job: "30m"
  deploy: "5m"

# 镜像 Tag 策略（可选）。默认 latest。
build:
  # 所有分支的默认 tag
  tag: ""
  # 按分支覆盖 tag，优先级高于 build.tag
  branch_tags: {}
  # 额外产出 sha-<短SHA> 标签
  sha_tag: false
  # docker build --platform，例如 linux/amd64；留空使用宿主默认
  platform: ""
  # docker build --pull
  pull: false
  # 额外 build-arg / label
  args: {}
  labels: {}
  # docker build --cache-from 列表
  cache_from: []

# 镜像推送（可选）。不写或 url 为空 = 只构建本地镜像。
registry:
  url: ""
  project: ""
  username: ""
  password: "${REGISTRY_PASSWORD:-}"

# 构建后本机部署（可选）。
deploy:
  enabled: false
  # 自动发现根目录：标准布局 <root>/<repo_name>/docker-compose.yml
  # 也可用 <root>/<namespace>/<repo_name>/... 或 <root>/<owner/repo>/...
  root: "/data/services"
  compose_files: ["docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]
  # 使用 compose --wait 等待容器 running/healthy
  wait: true
  wait_timeout: "120s"
  # never / missing / always；默认 never，禁止部署时拉取旧镜像
  pull: "never"
  remove_orphans: true

  # 显式登记（可选，优先于自动发现）。key 可以是 repo_name 或 owner/repo。
  # targets:
  #   atlas-market:
  #     dir: "/data/services/atlas-market"
  #     compose_file: ""          # 留空自动探测
  #     service: ""               # 留空启动整个 compose
  #     project_name: ""          # 可选 compose 项目名
  #     env:                      # 额外传给 compose 的环境变量
  #       APP_ENV: "prod"

# 流水线通知（可选）
notify:
  enabled: false
  on_started: true
  on_success: true
  on_failure: true
  lark:
    webhook_url: ""
    secret: ""
    timeout: "10s"
