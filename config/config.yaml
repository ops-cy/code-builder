# GitLab Webhook 自动镜像构建服务 — 配置示例
#
# 配置分为 server / code 两段与可选的 timeouts / build / registry / deploy / notify 段：
# 不维护仓库列表。在授权 GitLab 域名的任意项目添加 Webhook 即可接入；仓库地址、分支、
# Commit 全部取自事件数据，镜像名 = 仓库 URL 末尾（最后一个 / 与 .git 之间，转小写），
# Dockerfile 用仓库根目录的（缺失时套内置模板）。Tag 默认 latest，可用 build 段覆盖。
#
# ${VAR} 占位符在启动时从环境变量展开；引用未设置的环境变量将启动失败。

server:
  # HTTP 监听地址
  listen: ":8080"
  # git clone 的工作区根目录（容器内路径，按仓库+构建任务隔离子目录）
  workspace: "/app/workspace"
  # 构建日志存放目录（容器内路径），每个构建对应 <build_id>.log
  logs_dir: "/app/logs"
  # 待处理任务队列上限，超过后 webhook 返回 503
  queue_size: 10
  # 全局并行构建数；同一仓库的任务始终串行执行
  concurrency: 2

code:
  # Webhook Secret：与 GitLab Webhook 的 Secret token 完全一致
  # （经 ${GITLAB_WEBHOOK_SECRET} 环境变量注入，未设置将启动失败）
  webhook_secret: "${GITLAB_WEBHOOK_SECRET}"
  # 允许接入的 GitLab 实例域名（仓库地址域名必须等于它，否则拒绝）
  # 支持标准 SSH / HTTP(S) 地址比较，端口不影响判定
  domain: "code.gitlab.com"
  # 触发分支白名单（精确匹配）：只有这些分支的 Push 会触发构建
  # 省略时默认 ["main", "master"]
  branches:
    - "main"
    - "master"

# 各步骤超时（可选）；省略时使用下面的默认值。值为 Go duration（如 15m / 90s）。
timeouts:
  clone: "15m"
  build: "25m"
  job: "30m"
  deploy: "5m"

# 镜像 Tag 策略（可选）。默认（整段省略）= latest。
# 解析顺序：branch_tags[分支] → build.tag → latest
build:
  # 所有分支的默认 tag（例: latest / stable / v1.2.3）
  tag: ""
  # 按分支覆盖 tag（精确匹配），优先于 build.tag
  # 例: { "pre": "latest", "main": "stable" }
  branch_tags: {}

# 镜像推送（可选）。不写这一段 = 只构建本地镜像（默认，行为与以前完全一致）。
# 填写 registry.url 即启用：构建成功后打远程 tag 并推送。
# 判定规则：url 非空 → 推送；url 为空或缺省 → 仅本地。
registry:
  # 镜像仓库地址，例: registry.example.com（留空=仅本地构建）
  url: ""
  # 可选：镜像名前缀 / 命名空间，例: tenants
  project: ""
  # 可选：登录凭据。username 与 password 要么都填、要么都留空；
  # 都填则在推送前执行 docker login，都空则假定守护进程已登录。
  # 建议 password 用 ${REGISTRY_PASSWORD} 由环境变量注入（未设置将启动失败）。
  username: ""
  password: ""

# 构建后自动部署（可选）。省略或 enabled:false = 不部署。
# 构建成功后，用仓库 URL 末尾值（repo_name）匹配 targets 的 key；命中则执行：
#   docker compose -f <dir>/<compose_file> up -d [service]
# 工作目录 = <dir>；不 pull，compose 直接引用刚构建出的本地镜像。
# 部署失败不影响构建结果（构建仍 success，错误记入 DeployError）。
deploy:
  enabled: false
  # key = 仓库 URL 末尾（最后一个 / 与 .git 之间，转小写；大小写不敏感）
  # targets:
  #   atlas-market:
  #     # 服务目录（容器内绝对路径；宿主机需同路径挂载，见 docker-compose.yml）
  #     dir: "/data/services/atlas-market"
  #     # 目录内的启动文件（仅文件名，不含路径）
  #     compose_file: "docker-compose.yaml"
  #     # 可选：只启动某个 compose 服务；留空 = 启动整个文件
  #     service: ""
  #     # 兼容字段：保留解析但不参与判断（部署不看 tag）
  #     tag: ""

# 流水线通知（可选）。省略或 enabled:false = 不发送任何通知。
# 卡片格式与 Jenkins 共享库一致：标题 / 项目名称 / 构建发起 / 当前版本 / 持续时间 /
# 提交摘要 / 错误摘要 / 推送时间。通知失败不影响构建结果（记入 build 的 NotifyError）。
notify:
  # 是否开启通知
  enabled: false
  # 各事件开关（省略 = true）
  on_started: true      # 🚀 流水线开始
  on_success: true      # ✅ 流水线成功
  on_failure: true      # ❌ 流水线失败
  lark:
    # 飞书自定义机器人 Webhook，直接写在这里（含 token，属敏感信息，不会写入日志）。
    # 留空时使用 LARK_WEBHOOK_URL 环境变量（仍需 notify.enabled: true）。
    # 例: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    webhook_url: ""
    # 可选：机器人开启“签名校验”时填写密钥；留空时使用 LARK_SECRET 环境变量
    secret: ""
    # 单次投递超时
    timeout: "10s"
